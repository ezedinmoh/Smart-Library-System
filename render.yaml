services:
  - type: web
    name: smart-library
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn library_system.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: RENDER
        value: true
      - key: DJANGO_SETTINGS_MODULE
        value: library_system.settings_production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: false

      # ── Secrets — set these manually in Render dashboard ────────────────
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

      # ── Email ────────────────────────────────────────────────────────────
      - key: EMAIL_BACKEND
        value: library_system.email_backends.ResendWithBrevoFallbackBackend
      - key: DEFAULT_FROM_EMAIL
        value: "Smart Library <smartlibrarysupport@gmail.com>"
      - key: SERVER_EMAIL
        value: smartlibrarysupport@gmail.com
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_PASSWORD
        sync: false

      # ── Site ─────────────────────────────────────────────────────────────
      - key: ALLOWED_HOSTS
        value: smart-library-system-dy3a.onrender.com
      - key: SITE_NAME
        value: Smart Library Management System
      - key: SITE_URL
        value: https://smart-library-system-dy3a.onrender.com

      # ── Cloudinary ───────────────────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Stripe ───────────────────────────────────────────────────────────
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # ── Chapa ────────────────────────────────────────────────────────────
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false

  # ── Cron Jobs ─────────────────────────────────────────────────────────────

  # Daily at midnight - mark overdue books
  - type: cron
    name: update-overdue-books
    env: python
    schedule: "0 0 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py update_overdue_books --settings=library_system.settings_production"
    envVars:
      - key: RENDER
        value: true
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_BACKEND
        value: library_system.email_backends.ResendWithBrevoFallbackBackend
      - key: DEFAULT_FROM_EMAIL
        value: "Smart Library <smartlibrarysupport@gmail.com>"
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_PASSWORD
        sync: false
      - key: SITE_NAME
        value: Smart Library Management System
      - key: SITE_URL
        value: https://smart-library-system-dy3a.onrender.com

  # Daily at 9 AM - send due soon reminders
  - type: cron
    name: send-due-reminders
    env: python
    schedule: "0 9 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py send_due_soon_notifications --settings=library_system.settings_production"
    envVars:
      - key: RENDER
        value: true
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_BACKEND
        value: library_system.email_backends.ResendWithBrevoFallbackBackend
      - key: DEFAULT_FROM_EMAIL
        value: "Smart Library <smartlibrarysupport@gmail.com>"
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_PASSWORD
        sync: false
      - key: SITE_NAME
        value: Smart Library Management System
      - key: SITE_URL
        value: https://smart-library-system-dy3a.onrender.com

  # Daily at 10 AM - send overdue reminders
  - type: cron
    name: send-overdue-reminders
    env: python
    schedule: "0 10 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py send_overdue_reminders --settings=library_system.settings_production"
    envVars:
      - key: RENDER
        value: true
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_BACKEND
        value: library_system.email_backends.ResendWithBrevoFallbackBackend
      - key: DEFAULT_FROM_EMAIL
        value: "Smart Library <smartlibrarysupport@gmail.com>"
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_PASSWORD
        sync: false
      - key: SITE_NAME
        value: Smart Library Management System
      - key: SITE_URL
        value: https://smart-library-system-dy3a.onrender.com

  # Daily at 11 PM - calculate fines
  - type: cron
    name: calculate-fines
    env: python
    schedule: "0 23 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py calculate_fines --settings=library_system.settings_production"
    envVars:
      - key: RENDER
        value: true
      - key: DATABASE_URL
        sync: false
      - key: SITE_NAME
        value: Smart Library Management System
      - key: SITE_URL
        value: https://smart-library-system-dy3a.onrender.com
