services:
  - type: web
    name: smart-library-system
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn library_system.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: library_system.settings_production
      - key: PYTHON_VERSION
        value: 3.9.0
      # Allow iframe embedding from any domain
      - key: ALLOWED_IFRAME_DOMAINS
        value: "*"
